<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSearchin</title>
    <link rel="icon" type="image/x-icon" href="search_in_logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.12/cropper.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        * {
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.648) transparent;
        }
        :root {
            --safari-blue: #0071e3;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        button {
            cursor: pointer;
        }
        .background-container {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            z-index: -2;
            opacity: 80%;
            transition: background 0.4s ease;
        }

        /* Bottom button bar – always at bottom */
        .toolbar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            width: 100%;
            padding: 0 10px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .maincontentsection {
            border: 0.5px solid rgba(255, 255, 255, 0.1);
           width: 85%;
    padding: 5px;
            border-radius: 99999px;
            backdrop-filter: blur(30px);
            background: rgb(0 0 0 / 14%);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            max-width: 320px;
        }
        div#bottomLinksss {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
        }
        a {
            display: contents;
        }
        .bottom-link {
            color: #ccc;
            padding: 5px 15px;
            border-radius: 9999px;
            transition: 0.2s;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .bottom-link:hover {
            background: rgba(255, 255, 255, 0.215);
            color: white;
        }
        .bottom-link svg {
            width: 25px;
            height: 25px;
            fill: #e3e3e3;
        }

        /* Search bar – always at top */
        .bottom-links {
            position: fixed;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    border-radius: 99999px;
    display: flex;
    width: 95%;
    justify-content: center;
    align-items: center;
    max-width: 700px;
    z-index: 1000;
        }
        .address-bar-container {
          flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(30px);
    border-radius: 999px;
    border: 0.5px solid rgba(255, 255, 255, 0.1);
    background: rgb(0 0 0 / 14%);
        }
        #url-bar {
            width: 100%;
            height: 45px;
            border-radius: 9999px;
            padding: 0 70px 0 50px;
            color: #fff;
            font-size: 18px;
            outline: none;
            transition: background 0.4s ease;
            font-weight: 200;
            border: none;
            background: transparent;
        }
        #url-bar::placeholder {
            color: rgba(255, 255, 255, 0.648);
        }
        .search-icon {
            position: absolute;
            left: 5px;
            fill: white;
            z-index: 1000;
            width: 35px;
            height: 35px;
            display: flex;
            cursor: pointer;
            justify-content: center;
            align-items: center;
            background: transparent;
            border-radius: 50%;
            padding: 5px;
        }
        .search-icon:hover {
            background: rgb(255 255 255);
            fill: black;
        }
        #clearBtn {
            position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 20px;
    color: rgba(255, 255, 255, 0.7);
    cursor: pointer;
    display: none;
    font-weight: 100;
    z-index: 1001;
    text-align: center;
    border-radius: 50%;
        }
        #clearBtn:hover {
            color: #fff;
        }

        /* Suggestions – under the top search bar */
        .suggestions {
           position: absolute;
    top: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    width: 95%;
    max-width: 680px;
    backdrop-filter: blur(30px);
    border-radius: 25px;
    max-height: 60vh;
    overflow-y: auto;
    z-index: 1100;
    display: none;
    scrollbar-width: none;
    border: 0.5px solid rgba(255, 255, 255, 0.1);
    background: rgb(0 0 0 / 14%);
        }
        .suggestion-item {
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: background 0.15s ease;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.08);
        }
        .suggestion-item:last-child {
            border-bottom: none;
        }
        .suggestion-item:hover,
        .suggestion-item.selected {
            background: rgba(255, 255, 255, 0.18);
        }
        .suggestion-text {
            flex: 1;
            font-size: 15px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .delete-suggestion {
            color: #000;
            font-size: 18px;
            font-weight: 100;
            background: #ff3b30;
            width: 20px;
            height: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            flex-shrink: 0;
            margin-left: 8px;
        }

        /* Clear-all history button inside suggestions */
        .clear-all-history {
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: #ff6b6b;
            border-bottom: 0.5px solid rgba(255, 255, 255, 0.12);
            transition: background 0.15s ease;
            background: rgba(255, 59, 48, 0.08);
        }
        .clear-all-history:hover {
            background: rgba(255, 59, 48, 0.22);
        }

        /* Settings menu */
        .settings-menu {
            position: fixed;
            bottom: 80px;
            right: 10px;
            backdrop-filter: blur(30px);
            border-radius: 27px;
            z-index: 2000;
            display: none;
            background: rgb(0 0 0 / 55%);
            line-height: 20px;
            padding: 10px;
            border: 0.5px solid rgba(255, 255, 255, 0.1);
        }
        .menu-item {
            padding: 6px 10px;
            font-size: 14px;
            display: flex;
            align-items: center;
            cursor: pointer;
            justify-content: center;
            border-radius: 9999px;
            margin: 2px;
            transition: background 0.4s ease;
        }
        .menu-item:hover {
            background: rgba(255, 255, 255, 0.215);
        }

        /* Popups */
        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px;
            width: 90%;
            max-width: 380px;
            z-index: 3000;
            display: none;
            backdrop-filter: blur(10px);
            box-shadow: 0px 0px 8px 10000px rgb(0 0 0 / 60%);
            background: rgb(0 0 0 / 55%);
            border-radius: 30px;
            border: 0.5px solid rgba(255, 255, 255, 0.1);
        }
        .popup input {
            outline: none;
            width: 100%;
            padding: 10px;
            background: #ffffffe0;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            color: black;
            text-align: center;
        }
        div#bgGrid div {
            filter: brightness(1);
        }
        div#bgGrid div:hover {
            filter: brightness(0.5);
        }
    </style>
</head>

    <!-- BG recommends popup -->
    <div class="popup" id="bgPopup" style="width:92%; max-width:680px;">
        <div style="font-size:18px; font-weight:600; text-align:center; margin-bottom:16px;">Choose Wallpaper</div>
        <div id="bgGrid" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(130px,1fr)); gap:12px; max-height:420px; overflow-y:auto; padding:8px 0;"></div>
        <button onclick="hideBGPpopup()" style="margin-top: 16px; width: 100%; padding: 6px; border-radius: 9999px; background: rgb(255 255 255 / 16%); color: #ffffff; border: none; font-size: 16px;">Close Now</button>
    </div>

    <script>
        let currentBg = localStorage.getItem('backgroundImage') || localStorage.getItem('bsBackground') || '';
        let currentColor = localStorage.getItem('bsBackgroundColor') || '#0a0f1c';

        function applyBackground() {
            const container = document.getElementById('bgContainer');
            if (currentBg) {
                container.style.backgroundImage = `url('${currentBg}')`;
                container.style.backgroundColor = '';
            } else {
                container.style.backgroundImage = '';
                container.style.backgroundColor = currentColor;
            }
        }
        function updateImageBackground(src) {
            currentBg = src;
            localStorage.setItem('backgroundImage', src);
            localStorage.setItem('bsBackground', src);
            localStorage.removeItem('bsBackgroundColor');
            applyBackground();
        }
        function updateColorBackground(color) {
            currentColor = color;
            currentBg = '';
            localStorage.setItem('bsBackgroundColor', color);
            localStorage.removeItem('backgroundImage');
            localStorage.removeItem('bsBackground');
            applyBackground();
        }
        function removeBackground() {
            if (confirm("Reset background?")) {
                currentBg = '';
                currentColor = '#0a0f1c';
                localStorage.removeItem('backgroundImage');
                localStorage.removeItem('bsBackground');
                localStorage.removeItem('bsBackgroundColor');
                applyBackground();
            }
        }
        function pickColorBackground() {
            const input = document.createElement('input');
            input.type = 'color';
            input.value = currentColor;
            input.onchange = e => updateColorBackground(e.target.value);
            input.click();
            document.getElementById('settingsMenu').style.display = 'none';
        }

        // ========== SEARCH HISTORY ==========
        let storedInputs = JSON.parse(localStorage.getItem('storedInputs') || '[]');
        let selectedSuggestionIndex = -1;

        function saveSearchHistory() {
            localStorage.setItem('storedInputs', JSON.stringify(storedInputs));
        }

        function updateClearButton() {
            const clearBtn = document.getElementById('clearBtn');
            const urlBar = document.getElementById('url-bar');
            clearBtn.style.display = urlBar.value.trim() ? 'block' : 'none';
        }

        // Delete ALL history (used by the trash button + the button inside suggestions)
        function clearAllHistory() {
            if (confirm("By confirming, all the search history will be deleted.")) {
                storedInputs = [];
                saveSearchHistory();
                document.getElementById('suggestions').style.display = 'none';
                selectedSuggestionIndex = -1;
            }
        }

        function showSuggestions(value) {
            const suggestionsEl = document.getElementById('suggestions');
            suggestionsEl.innerHTML = '';
            selectedSuggestionIndex = -1;

            const filtered = value
                ? storedInputs.filter(item => item.toLowerCase().includes(value.toLowerCase()))
                : [...storedInputs];

            if (filtered.length === 0) {
                suggestionsEl.style.display = 'none';
                return;
            }

            // Clear-all button at the top of the list
            const clearAllDiv = document.createElement('div');
            // clearAllDiv.className = 'clear-all-history';
            clearAllDiv.innerHTML = `
                
            `;
            clearAllDiv.addEventListener('click', (e) => {
                e.stopPropagation();
                clearAllHistory();
            });
            suggestionsEl.appendChild(clearAllDiv);

            filtered.forEach((suggestion) => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';

                const textSpan = document.createElement('span');
                textSpan.className = 'suggestion-text';
                textSpan.textContent = suggestion;

                const delSpan = document.createElement('span');
                delSpan.className = 'delete-suggestion';
                delSpan.textContent = '×';
                delSpan.addEventListener('click', (e) => {
                    e.stopImmediatePropagation();
                    deleteSuggestion(suggestion);
                });

                div.appendChild(textSpan);
                div.appendChild(delSpan);

                div.addEventListener('click', () => {
                    document.getElementById('url-bar').value = suggestion;
                    updateClearButton();
                    suggestionsEl.style.display = 'none';
                    performSearch(suggestion);
                });

                suggestionsEl.appendChild(div);
            });

            suggestionsEl.style.display = 'block';
        }

        function deleteSuggestion(suggestion) {
            const index = storedInputs.indexOf(suggestion);
            if (index > -1) {
                storedInputs.splice(index, 1);
                saveSearchHistory();
                const value = document.getElementById('url-bar').value;
                showSuggestions(value);
            }
        }

        function updateSuggestionHighlight() {
            const items = document.querySelectorAll('#suggestions .suggestion-item');
            items.forEach((item, i) => {
                if (i === selectedSuggestionIndex) {
                    item.classList.add('selected');
                    item.scrollIntoView({ block: 'nearest' });
                } else {
                    item.classList.remove('selected');
                }
            });
        }

        function performSearch(query) {
            query = query.trim();
            if (!query) return;

            const existingIndex = storedInputs.indexOf(query);
            if (existingIndex > -1) {
                storedInputs.splice(existingIndex, 1);
            }
            storedInputs.unshift(query);
            if (storedInputs.length > 30) storedInputs.pop();
            saveSearchHistory();

            if (query.includes('.') && !query.includes(' ')) {
                window.location.href = query.startsWith('http') ? query : 'https://' + query;
            } else {
                window.location.href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
            }
        }

        // Settings toggle
        function toggleSettings(e) {
            if (e) e.stopPropagation();
            const menu = document.getElementById('settingsMenu');
            const isVisible = menu.style.display === 'block';
            menu.style.display = isVisible ? 'none' : 'block';
        }

        // Copy & Paste
        function copyUrlBar() {
            const urlBar = document.getElementById('url-bar');
            const text = urlBar.value.trim();
            if (!text) {
                const original = urlBar.placeholder;
                urlBar.placeholder = "Nothing to copy";
                setTimeout(() => urlBar.placeholder = original, 1200);
                return;
            }
            navigator.clipboard.writeText(text).then(() => {
                const original = urlBar.placeholder;
                urlBar.placeholder = "Copied!";
                setTimeout(() => urlBar.placeholder = original, 1200);
            }).catch(() => {
                alert("Copy failed. Please try again.");
            });
        }

        function pasteToUrlBar() {
            navigator.clipboard.readText().then(text => {
                const urlBar = document.getElementById('url-bar');
                urlBar.value = text;
                updateClearButton();
                showSuggestions(text.trim());
                urlBar.focus();
            }).catch(() => {
                alert("Paste failed. Please allow clipboard permission or try again.");
            });
        }

        // Background upload
        function uploadBackground() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 15 * 1024 * 1024) {
                    alert("Image is too large. Please choose an image under 15MB.");
                    return;
                }
                document.getElementById('settingsMenu').style.display = 'none';
                const originalPlaceholder = document.getElementById('url-bar').placeholder;
                document.getElementById('url-bar').placeholder = "Processing image...";
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 1920;
                        if (width > maxDim || height > maxDim) {
                            if (width > height) {
                                height = Math.round(height * maxDim / width);
                                width = maxDim;
                            } else {
                                width = Math.round(width * maxDim / height);
                                height = maxDim;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.85);
                        updateImageBackground(compressedDataUrl);
                        document.getElementById('url-bar').placeholder = originalPlaceholder;
                    };
                    img.onerror = () => {
                        alert("Failed to load image.");
                        document.getElementById('url-bar').placeholder = originalPlaceholder;
                    };
                    img.src = ev.target.result;
                };
                reader.onerror = () => {
                    alert("Error reading file.");
                    document.getElementById('url-bar').placeholder = originalPlaceholder;
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }

        const recommendedBGs = [
            "backgrounds/1.jpg",
            "backgrounds/2.jpg",
            "backgrounds/4.jpg",
            "backgrounds/5.jpg",
            "backgrounds/6.avif",
            "backgrounds/8.avif",
            "backgrounds/9.avif",
            "backgrounds/11.jpg",
        ];
        function showRecommendedBGs() {
            const grid = document.getElementById('bgGrid');
            grid.innerHTML = '';
            recommendedBGs.forEach(src => {
                const div = document.createElement('div');
                div.style.height = '118px';
                div.style.borderRadius = '12px';
                div.style.background = `url('${src}') center/cover`;
                div.style.cursor = 'pointer';
                div.onclick = () => { updateImageBackground(src); hideBGPpopup(); };
                grid.appendChild(div);
            });
            document.getElementById('bgPopup').style.display = 'block';
            document.getElementById('settingsMenu').style.display = 'none';
        }
        function hideBGPpopup() {
            document.getElementById('bgPopup').style.display = 'none';
        }

        // Event listeners
        const urlBar = document.getElementById('url-bar');
        const suggestionsEl = document.getElementById('suggestions');
        const searchIcon = document.getElementById('searchIcon');
        const clearBtn = document.getElementById('clearBtn');

        clearBtn.addEventListener('click', () => {
            urlBar.value = '';
            updateClearButton();
            urlBar.focus();
            showSuggestions('');
        });

        searchIcon.addEventListener('click', () => {
            const query = urlBar.value.trim();
            if (query) performSearch(query);
            else urlBar.focus();
        });

        urlBar.addEventListener('input', () => {
            updateClearButton();
            showSuggestions(urlBar.value.trim());
        });

        urlBar.addEventListener('focus', () => {
            showSuggestions(urlBar.value.trim());
        });

        urlBar.addEventListener('keydown', (e) => {
            const items = suggestionsEl.querySelectorAll('.suggestion-item');
            const isOpen = suggestionsEl.style.display === 'block' && items.length > 0;

            if (e.key === 'ArrowDown') {
                if (!isOpen) {
                    showSuggestions(urlBar.value.trim());
                    return;
                }
                e.preventDefault();
                selectedSuggestionIndex = Math.min(selectedSuggestionIndex + 1, items.length - 1);
                updateSuggestionHighlight();
            } else if (e.key === 'ArrowUp') {
                if (!isOpen) return;
                e.preventDefault();
                selectedSuggestionIndex = Math.max(selectedSuggestionIndex - 1, -1);
                updateSuggestionHighlight();
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (isOpen && selectedSuggestionIndex >= 0) {
                    const text = items[selectedSuggestionIndex].querySelector('.suggestion-text').textContent;
                    urlBar.value = text;
                    updateClearButton();
                    suggestionsEl.style.display = 'none';
                    performSearch(text);
                } else {
                    const value = urlBar.value.trim();
                    if (value) performSearch(value);
                }
            } else if (e.key === 'Escape') {
                suggestionsEl.style.display = 'none';
                selectedSuggestionIndex = -1;
            }
        });

        // Close on outside click
        document.addEventListener('click', e => {
            if (!e.target.closest('.bottom-links') && !e.target.closest('#suggestions')) {
                suggestionsEl.style.display = 'none';
                selectedSuggestionIndex = -1;
            }
            if (!e.target.closest('#settingsMenu') && !e.target.closest('#settingsBtn')) {
                document.getElementById('settingsMenu').style.display = 'none';
            }
        });

        // Image cropper
        let cropperInstance = null;
        function openImageCropper() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'image/*';
            input.onchange = e => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 20 * 1024 * 1024) {
                    alert("Please select an image smaller than 20MB");
                    return;
                }
                document.getElementById('settingsMenu').style.display = 'none';
                const reader = new FileReader();
                reader.onload = function(ev) {
                    const img = document.getElementById('cropperImage');
                    img.src = ev.target.result;
                    document.getElementById('cropperPopup').style.display = 'flex';
                    if (cropperInstance) cropperInstance.destroy();
                    cropperInstance = new Cropper(img, {
                        aspectRatio: NaN,
                        viewMode: 1,
                        autoCropArea: 0.8,
                        movable: true,
                        zoomable: true,
                        rotatable: true,
                        scalable: true,
                        background: false,
                        center: true,
                    });
                };
                reader.readAsDataURL(file);
            };
            input.click();
        }
        function applyCroppedBackground() {
            if (!cropperInstance) return;
            const croppedCanvas = cropperInstance.getCroppedCanvas({
                maxWidth: 1920,
                maxHeight: 1080,
                imageSmoothingQuality: 'high'
            });
            const croppedDataUrl = croppedCanvas.toDataURL('image/jpeg', 0.88);
            updateImageBackground(croppedDataUrl);
            cancelCrop();
        }
        function cancelCrop() {
            const popup = document.getElementById('cropperPopup');
            popup.style.display = 'none';
            if (cropperInstance) {
                cropperInstance.destroy();
                cropperInstance = null;
            }
        }

        window.onload = () => {
            applyBackground();
            updateClearButton();
            setTimeout(() => {
                document.getElementById('url-bar').focus();
            }, 300);
        };
    </script>
</body>
</html>
