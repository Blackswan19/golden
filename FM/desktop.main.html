document.addEventListener('contextmenu', e => e.preventDefault());
function getColor(name) {
  const colors = [
    // "linear-gradient(135deg, #2AABEE, #1e88e5)",
    // "linear-gradient(135deg, #e53935, #c62828)",
    // "linear-gradient(135deg, #43a047, #2e7d32)",
    // "linear-gradient(135deg, #fb8c00, #ef6c00)",
    // "linear-gradient(135deg, #8e24aa, #6a1b9a)",
    // "linear-gradient(135deg, #00acc1, #00838f)",
    // "linear-gradient(135deg, #7cb342, #558b2f)",
    // "linear-gradient(135deg, #f4511e, #d84315)"
  ];
  let hash = 0;
  for (let i = 0; i < name.length; i++) {
    hash = name.charCodeAt(i) + ((hash << 5) - hash);
  }
  return colors[Math.abs(hash) % colors.length];
}

function getInitial(name) {
  return name.trim()[0]?.toUpperCase() || "?";
}

function openService(site) {
  // Highlight active item
  document.querySelectorAll(".site-item").forEach(el => el.classList.remove("active"));
  const items = document.querySelectorAll(".site-item");
  items.forEach(item => {
    if (item.querySelector("h3")?.textContent === site.name) {
      item.classList.add("active");
    }
  });

  document.getElementById("serviceTitle").textContent = site.name;
  document.getElementById("servicePlaceholder").classList.add("hidden");
  document.getElementById("serviceFrame").src = site.url;
}

function closeService() {
  document.getElementById("serviceTitle").textContent = "Select a service";
  document.getElementById("servicePlaceholder").classList.remove("hidden");
  document.getElementById("serviceFrame").src = "about:blank";
  document.querySelectorAll(".site-item").forEach(el => el.classList.remove("active"));
}

function createSiteItem(site) {
  const div = document.createElement("div");
  div.className = "site-item";
  div.onclick = () => openService(site);

  const bg = getColor(site.name);
  const initial = getInitial(site.name);

  div.innerHTML = `
    <div class="letter-icon" style="background: ${bg};">${initial}</div>
    <div class="site-info">
      <h3>${site.name}</h3>
      <p>${site.desc || ""}</p>
    </div>
  `;

  return div;
}

function renderAll() {
  const container = document.getElementById("sectionsContainer");
  container.innerHTML = "";

  siteGroups.forEach(group => {
    const section = document.createElement("div");
    section.className = "section";

    const h2 = document.createElement("h2");
    h2.textContent = group.heading;
    section.appendChild(h2);

    const list = document.createElement("div");
    list.className = "site-list";

    group.sites.forEach(site => {
      list.appendChild(createSiteItem(site));
    });

    section.appendChild(list);
    container.appendChild(section);
  });
}

function renderFiltered(query = "") {
  const q = query.toLowerCase().trim();
  if (!q) {
    renderAll();
    return;
  }

  const container = document.getElementById("sectionsContainer");
  container.innerHTML = "";

  siteGroups.forEach(group => {
    const matches = group.sites.filter(s =>
      s.name.toLowerCase().includes(q) ||
      (s.desc && s.desc.toLowerCase().includes(q))
    );

    if (!matches.length) return;

    const section = document.createElement("div");
    section.className = "section";
    section.innerHTML = `<h2>${group.heading}</h2>`;

    const list = document.createElement("div");
    list.className = "site-list";
    matches.forEach(site => list.appendChild(createSiteItem(site)));
    section.appendChild(list);
    container.appendChild(section);
  });
}

renderAll();

document.getElementById("searchInput").addEventListener("input", e => {
  renderFiltered(e.target.value);
});
