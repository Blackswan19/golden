        2: "https://forms.gle/VqJ1Wqtj8HxXa84e9",
      };

      if (rate !== null) {
        titleEl.textContent = tabNames[currentTab];
        const applyFormUrl = formLinks[currentTab] || formLinks[0];
        contentEl.innerHTML = `
          <div class="amount-box">
            <input id="amount-input" type="number" value="1000" oninput="calculateFee()">
          </div>
          <div class="calc-result">
            <div>
              <span class="text-secondary">${tabNames[currentTab]} fee (${rate}%)</span>
              <span id="fee-amount">₹65.00</span>
            </div>
          </div>
          <button class="btn-secondary"><a href="${applyFormUrl}" target="_self">Apply Now</a></button>
          <footer>© BS&MFI Solutions. All Rights Reserved.</footer>
        `;
        calculateFee();
      } else if (currentTab === 3) {
        titleEl.textContent = "Pre-Saver";
        contentEl.innerHTML = `
          <div style="text-align:center; padding: 10px 0 20px;">
            <div style="font-size:48px; margin-bottom:12px;">📦</div>
            <h3 style="font-size:18px; font-weight:600; margin-bottom:8px;">Welcome to Pre-Saver</h3>
            <p style="color:#7d8b99; font-size:14px; line-height:1.5; margin-bottom:24px;">
              By using Pre-saver you can save the particular upcoming offer (or) amounts on a particular date.
            </p>
            <a href="https://forms.gle/rtcayowFYw48u94PA" target="_self">
              <button class="btn-primary">Pre-Save Now</button>
            </a>
          </div>
        `;
      }
    }

    function calculateFee() {
      const input = document.getElementById('amount-input');
      if (!input) return;
      let amount = parseFloat(input.value) || 1000;
      const rate = fees[currentTab];
      const fee = (amount * rate / 100);
      document.getElementById('fee-amount').textContent = '₹' + fee.toFixed(2);
    }

    function hideModal() {
      document.getElementById('modal').classList.remove('show');
    }

    function goBack() {
      if (window.history.length > 1) window.history.back();
      else alert("Back");
    }

    window.onload = () => switchTab(0);
  </script>
</body>
</html>
